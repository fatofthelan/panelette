; PlatformIO Project Configuration File
; Target: CYD - "Cheap Yellow Display" ESP32-2432S028R (ESP32-WROOM + 2.8" ILI9341 + XPT2046 touch)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; main.cpp stores /config.json on LittleFS (falls back to compiled defaults if absent)
board_build.filesystem = littlefs

lib_deps =
    ; v6 - the sketch uses DynamicJsonDocument(size) / StaticJsonDocument<N> /
    ; containsKey(), all deprecated-then-removed in ArduinoJson v7.
    bblanchon/ArduinoJson @ ^6.21.5
    bodmer/TFT_eSPI @ ^2.5.43
    ; The PlatformIO registry build of XPT2046_Touchscreen is too old - its
    ; begin() takes no args. The sketch calls ts.begin(touchSPI), which needs
    ; PaulStoffregen's current version.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; TFT_eSPI is configured entirely from here (USER_SETUP_LOADED bypasses its
; User_Setup.h). Pins below are the fixed CYD ESP32-2432S028R wiring.
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    ; Fonts used by the sketch: 1 (GLCD), 2, 4, plus the GFXFF "Free Fonts"
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
