; PlatformIO Project Configuration File
; Target: CYD - "Cheap Yellow Display" ESP32-2432S028R (ESP32-WROOM + 2.8" 240x320 + XPT2046 touch)
;
; The CYD is not one board. The same "ESP32-2432S028R" label ships with an
; ST7789 *or* an ILI9341 panel, RGB *or* BGR subpixel order, with or without a
; hardware colour inversion. Pick the env that matches your board:
;
;   pio run -e cyd_ili9341    -t upload    <- ELEGOO (verified) + other ILI9341
;                                             CYDs. This is the default env.
;   pio run -e cyd_st7789     -t upload    <- "normal" ST7789 CYDs (no inversion)
;   pio run -e esp32dev       -t upload    <- ST7789 boards whose colours come
;                                             out inverted on cyd_st7789 (the
;                                             original dev board - see
;                                             fixColor565 / PANEL_INVERT_COLORS)
;
; Symptom guide when the screen is wrong:
;   white screen, no image ............. wrong driver -> try another env
;   white screen, negative-image text .. PANEL_INVERT_COLORS is backwards for this panel
;   colours swapped (blue<->orange) .... flip TFT_RGB_ORDER (TFT_BGR <-> TFT_RGB)
;   small offset / thin black band ..... add TFT_ROW_OFFSET / TFT_COL_OFFSET
;
; build-installer.sh builds all three envs for the browser installer. Touch
; calibration (TOUCH_*_MIN/MAX in main.ino) is also per-panel.

[platformio]
default_envs = cyd_ili9341

[env]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; src/main.ino stores /config.json on LittleFS (falls back to compiled defaults if absent)
board_build.filesystem = littlefs

; Minimal SPIFFS layout: ~1.9 MB app (x2 OTA slots) + ~190 KB filesystem.
; config.json is ~15 KB so the small FS is fine, and this gives the app
; headroom the default ~1.28 MB slot was running out of.
; NOTE: changing this reformats the on-device filesystem on next boot -
; export the config from the web UI first, re-import after flashing.
; Arduino IDE equivalent: Tools -> Partition Scheme -> "Minimal SPIFFS
; (1.9MB APP with OTA/190KB SPIFFS)".
board_build.partitions = min_spiffs.csv

lib_deps =
    ; v6 - the sketch uses DynamicJsonDocument(size) / StaticJsonDocument<N> /
    ; containsKey(), all deprecated-then-removed in ArduinoJson v7.
    bblanchon/ArduinoJson @ ^6.21.5
    bodmer/TFT_eSPI @ ^2.5.43
    ; The PlatformIO registry build of XPT2046_Touchscreen is too old - its
    ; begin() takes no args. The sketch calls ts.begin(touchSPI), which needs
    ; PaulStoffregen's current version.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    ; Optional HA WebSocket live updates (cfg.haLiveUpdates, off by default).
    links2004/WebSockets @ ^2.4.1

; ---- Shared TFT_eSPI config ---------------------------------------------------
; TFT_eSPI is configured entirely from build_flags (USER_SETUP_LOADED bypasses
; its User_Setup.h) - no vendored copy, nothing to keep in sync. The pin map is
; the same across every CYD variant seen so far; only the driver / colour flags
; differ, so those live in the per-board envs below.
[panel]
common_flags =
    -D USER_SETUP_LOADED=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_TOUCH_FREQUENCY=2500000
    ; Font set matches the original User_Setup.h (sketch itself uses 1/2/4 + GFXFF)
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

; ---- The original board -----------------------------------------------------
; ST7789 panel with BGR order that renders every colour as its bitwise
; complement. PANEL_INVERT_COLORS makes fixColor565() do the ~c compensation.
; Do NOT add TFT_INVERSION_OFF/_ON to fight the inversion without also dropping
; PANEL_INVERT_COLORS, or it double-inverts. This is the env CI ships.
[env:esp32dev]
build_flags =
    ${panel.common_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D PANEL_INVERT_COLORS=1
    -D PANEL_VARIANT='"ST7789+inv"'

; ---- ELEGOO and other ILI9341 CYDs -----------------------------------------
; ILI9341_2_DRIVER is the alternative init table CYD folks use when the plain
; ILI9341_DRIVER gives a white screen. No colour-complement quirk on these, so
; PANEL_INVERT_COLORS is left undefined (fixColor565 becomes a pass-through).
; If colours come out blue<->orange swapped, change TFT_BGR to TFT_RGB.
[env:cyd_ili9341]
build_flags =
    ${panel.common_flags}
    -D ILI9341_2_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D PANEL_VARIANT='"ILI9341"'

; ---- "Normal" ST7789 CYDs (no bitwise-complement quirk) --------------------
; Same driver as the original board but without the software inversion. Try
; this if cyd_ili9341 shows a white screen with no image (wrong driver) but the
; original esp32dev build shows white with negative-image text.
[env:cyd_st7789]
build_flags =
    ${panel.common_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D PANEL_VARIANT='"ST7789"'
