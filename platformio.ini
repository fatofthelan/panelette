; PlatformIO Project Configuration File
; Target: CYD - "Cheap Yellow Display" ESP32-2432S028R (ESP32-WROOM + 2.8" ST7789 240x320 + XPT2046 touch)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; src/main.ino stores /config.json on LittleFS (falls back to compiled defaults if absent)
board_build.filesystem = littlefs

; Minimal SPIFFS layout: ~1.9 MB app (x2 OTA slots) + ~190 KB filesystem.
; config.json is ~15 KB so the small FS is fine, and this gives the app
; headroom the default ~1.28 MB slot was running out of.
; NOTE: changing this reformats the on-device filesystem on next boot -
; export the config from the web UI first, re-import after flashing.
; Arduino IDE equivalent: Tools -> Partition Scheme -> "Minimal SPIFFS
; (1.9MB APP with OTA/190KB SPIFFS)".
board_build.partitions = min_spiffs.csv

lib_deps =
    ; v6 - the sketch uses DynamicJsonDocument(size) / StaticJsonDocument<N> /
    ; containsKey(), all deprecated-then-removed in ArduinoJson v7.
    bblanchon/ArduinoJson @ ^6.21.5
    bodmer/TFT_eSPI @ ^2.5.43
    ; The PlatformIO registry build of XPT2046_Touchscreen is too old - its
    ; begin() takes no args. The sketch calls ts.begin(touchSPI), which needs
    ; PaulStoffregen's current version.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; TFT_eSPI is configured entirely from here (USER_SETUP_LOADED bypasses its
; User_Setup.h). These values are a 1:1 port of the User_Setup.h that this
; project used successfully under the Arduino IDE - this CYD uses an ST7789
; panel with BGR color order, NOT the ILI9341 many CYDs ship with.
; Note: the sketch's fixColor565() software color-inversion hack was tuned
; against exactly this config - do not add TFT_INVERSION_OFF without also
; removing that hack, or colors will double-invert.
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_TOUCH_FREQUENCY=2500000
    ; Font set matches User_Setup.h (sketch itself uses 1/2/4 + GFXFF)
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
